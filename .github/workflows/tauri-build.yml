name: Build Windows EXE & Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows-exe:
    name: Build Windows EXE (.exe / .msi)
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Build Windows Installer (.exe & .msi)
        run: npx tauri build

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-installer
          path: src-tauri/target/release/bundle/
          retention-days: 14

  build-android-apk:
    name: Build Android APK
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Init and Build Android APK
        run: |
          npx tauri android init
          npx tauri android build --apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-installer
          path: src-tauri/gen/android/app/build/outputs/apk/
          retention-days: 14


