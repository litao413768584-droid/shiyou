name: Build Windows EXE & Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows-exe:
    name: Build Windows EXE
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm install

      - name: Build Tauri Executable
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: '石油密度与体积换算计算器 v__VERSION__'
          releaseBody: '自动生成的 Windows (.exe/.msi) 与 Android (.apk) 安装包'
          releaseDraft: false
          prerelease: false

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

  build-android-apk:
    name: Build Android APK
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nsetup/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Init and Build Android APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          npx tauri android init || true
          npx tauri android build --apk || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-installer
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            dist/
          retention-days: 14

