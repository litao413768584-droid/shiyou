build-windows:
  runs-on: windows-latest
  steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Install NSIS
      run: choco install nsis

    - name: Setup NSIS path
      run: echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

    - name: Debug and recreate tauri.conf.json
      run: |
        echo '{"$schema":"https://schema.tauri.app/config/2","productName":"shiyou","version":"0.1.0","identifier":"com.shiyou.app","build":{"beforeDevCommand":"npm run dev","devUrl":"http://localhost:1420","beforeBuildCommand":"npm run build","frontendDist":"../dist"},"app":{"windows":[{"title":"й╞ся"}]},"bundle":{"icon":[],"targets":["nsis","msi"],"windows":{"certificateThumbprint":null,"digestAlgorithm":"sha256","timestampUrl":""}}}' > src-tauri/tauri.conf.json
        cat src-tauri/tauri.conf.json

    - name: Install dependencies
      run: npm install

    - name: Generate icons
      run: npx tauri icon

    - name: Build Windows EXE
      run: npx tauri build --target x86_64-pc-windows-msvc

    - uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: src-tauri/target/release/oil-calculator.exe