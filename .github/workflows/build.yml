name: Build Static Website ZIP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Code
        run: npm run build

      - name: Package Dist Folder to ZIP
        run: |
          cd dist
          zip -r ../offline-oil-calc.zip *
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: offline-oil-calc-website
          path: offline-oil-calc.zip
          retention-days: 7
